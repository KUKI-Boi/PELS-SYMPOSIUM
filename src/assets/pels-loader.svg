<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
<title id="title">PELS Symposium — Loading</title><desc id="desc">Electric current travels through circuit traces around a glowing lightning bolt.</desc>
<defs>
 <radialGradient id="halo"><stop stop-color="#073c51" stop-opacity=".65"/><stop offset="1" stop-color="#07121f" stop-opacity="0"/></radialGradient>
 <linearGradient id="energy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#bcfaff"/><stop offset=".5" stop-color="#32dcec"/><stop offset="1" stop-color="#1597cf"/></linearGradient>
 <linearGradient id="bolt" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#fff0b4"/><stop offset="1" stop-color="#f1b846"/></linearGradient>
 <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#78b0c4" opacity=".12"/></pattern>
</defs>
<style>
 .orbit{transform-origin:480px 235px;animation:orbit 4s linear infinite}
 .reverse{animation-direction:reverse;animation-duration:4s}
 .pulse{animation:pulse 2s ease-in-out infinite}
 .flow{stroke-dasharray:26 474;animation:flow 4s linear infinite}
 .wave{stroke-dasharray:65 535;animation:wave 4s linear infinite}
 .d1{animation:pulse 2s ease-in-out infinite}.d2{animation:pulse 2s .25s ease-in-out infinite}.d3{animation:pulse 2s .5s ease-in-out infinite}
 @keyframes orbit{to{transform:rotate(360deg)}}
 @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
 @keyframes flow{to{stroke-dashoffset:-500}}
 @keyframes wave{to{stroke-dashoffset:-600}}
 @media(prefers-reduced-motion:reduce){*{animation:none!important}.flow,.wave{opacity:.7}}
</style>
<rect width="960" height="600" fill="none"/>
<rect width="960" height="600" fill="none"/>
<ellipse cx="480" cy="250" rx="325" ry="255" fill="url(#halo)"/>
<g fill="none" stroke="#163748" stroke-width="1.5">
 <path id="left" d="M80 275H210L250 235H355" pathLength="500"/>
 <path id="right" d="M880 195H750L710 235H605" pathLength="500"/>
 <path d="M146 195H240L270 225H325M814 275H720L690 245H635"/>
 <circle cx="80" cy="275" r="4"/><circle cx="880" cy="195" r="4"/>
 <circle cx="146" cy="195" r="3"/><circle cx="814" cy="275" r="3"/>
</g>
<g fill="none" stroke="#45e6f2" stroke-width="2.5" stroke-linecap="round">
 <use href="#left" class="flow"/><use href="#right" class="flow"/>
</g>
<circle cx="480" cy="235" r="119" fill="none" stroke="#1b3847" stroke-dasharray="2 9"/>
<circle cx="480" cy="235" r="106" fill="none" stroke="#183344" stroke-width="2"/>
<g class="orbit" fill="none" stroke="url(#energy)" stroke-width="3" stroke-linecap="round">
 <path d="M480 129 A106 106 0 0 1 586 235"/>
 <path d="M480 341 A106 106 0 0 1 374 235" opacity=".45"/>
 <circle cx="480" cy="129" r="4" fill="#b8faff" stroke="none"/>
</g>
<circle class="orbit reverse" cx="480" cy="235" r="88" fill="none" stroke="#d9af56" stroke-width="1" stroke-dasharray="36 102" opacity=".55"/>
<circle cx="480" cy="235" r="72" fill="#0b1e2c" stroke="#204352"/>
<path id="lightning" d="M491 184 L451 240 H477 L468 286 L511 227 H485 Z" fill="url(#bolt)"/>
<use href="#lightning" filter="url(#glow)" class="pulse" opacity=".6"/>
<g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
 <text x="480" y="75" font-size="11" letter-spacing="4" fill="#6e96a7">POWER ELECTRONICS SOCIETY</text>
 <text x="484" y="410" font-size="49" font-weight="700" letter-spacing="9" fill="#edf8ff">PELS</text>
 <text x="482" y="441" font-size="16" letter-spacing="5" fill="#8eb8cc">SYMPOSIUM</text>
 <text x="480" y="549" font-size="10" letter-spacing="3" fill="#7094a6">POWERING IDEAS. CONNECTING MINDS.</text>
</g>
<path id="signal" d="M330 482H422L438 482L451 468L464 497L479 460L493 491L505 482H630" pathLength="600" fill="none" stroke="#203f50" stroke-width="2"/>
<path d="M330 482H422L438 482L451 468L464 497L479 460L493 491L505 482H630" pathLength="600" fill="none" class="wave" stroke="#54e7ee" stroke-width="2.5" stroke-linecap="round"/>
<g fill="#77b7c8"><circle class="d1" cx="467" cy="514" r="2"/><circle class="d2" cx="480" cy="514" r="2"/><circle class="d3" cx="493" cy="514" r="2"/></g>
</svg>